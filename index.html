<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aplicativo de previsão do tempo moderno e responsivo.">
    
    <title>Weather App | Previsão do Tempo</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <main class="weather-container">
        <header>
            <h1>Previsão do tempo</h1>
            
            <form id="search-form" aria-label="Formulário de busca de cidade">
                <label for="city-input" class="sr-only">Digite o nome da cidade</label>
                <input 
                    type="text" 
                    id="city-input" 
                    placeholder="Buscar cidade..." 
                    required 
                    autocomplete="off"
                    list="suggestions"
                >
                <datalist id="suggestions"></datalist>
                <button type="submit" aria-label="Buscar previsão">
                    Buscar
                </button>
            </form>
        </header>

        <div id="weather-data" class="weather-info hidden">
            <h2 id="city-name">
                <span id="city">Nome da Cidade</span>
                <img id="country" src="" alt="Bandeira do País">
            </h2>
            
            <p id="temperature"><span>0</span>&deg;C</p>
            
            <div id="description-container">
                <p id="description">Descrição do clima</p>

                <img id="weather-icon" src="" alt="Ícone do Clima">
            </div>
            
            <div id="details-container">
                <p id="humidity">Umidade: <span>0</span>%</p>
                <p id="wind">Vento: <span>0</span> km/h</p>
            </div>
        </div>

        <section id="error-message" class="hidden" aria-live="assertive">
            <p>Cidade não encontrada. Tente novamente.</p>
        </section>
    </main>

    <script src="./js/app.js" type="module"></script>
</body>
</html>
